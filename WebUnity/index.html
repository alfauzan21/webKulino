<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fly To The Moon - Kulino Game</title>
  <link rel="shortcut icon" href="../assets/icon/kulino-logo-blue.png" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1f3a 0%, #0a0e1f 100%);
      color: white;
    }

    /* ========== HEADER ========== */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(10, 14, 31, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid rgba(99, 102, 241, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-section img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.5));
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-text h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }

    .logo-text p {
      font-size: 10px;
      color: #94a3b8;
      margin-top: -2px;
    }

    .wallet-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%);
      border-radius: 12px;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .wallet-address {
      font-size: 12px;
      font-family: 'Courier New', monospace;
      color: #a5b4fc;
    }

    .game-button {
      padding: 8px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .game-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    /* ========== MAIN CONTAINER ========== */
    .main-container {
      display: flex;
      height: 100vh;
      padding-top: 60px;
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
      width: 200px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-right: 2px solid rgba(99, 102, 241, 0.3);
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      transition: transform 0.3s;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      background: rgba(99, 102, 241, 0.1);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      border: 1px solid transparent;
    }

    .sidebar-item:hover {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.3) 0%, rgba(139, 92, 246, 0.3) 100%);
      border-color: rgba(99, 102, 241, 0.5);
      transform: translateX(5px);
    }

    .sidebar-item.exit {
      background: rgba(239, 68, 68, 0.2);
      margin-top: auto;
    }

    .sidebar-item.exit:hover {
      background: rgba(239, 68, 68, 0.4);
    }

    .sidebar-icon {
      width: 32px;
      height: 32px;
      font-size: 24px;
    }

    .sidebar-text {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ========== GAME CANVAS ========== */
    .canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    #unity-container {
      width: 100%;
      height: 100%;
      max-width: 1280px;
      max-height: 720px;
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #unity-loading-bar {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      max-width: 400px;
    }

    #unity-progress-bar-empty {
      width: 100%;
      height: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    #unity-progress-bar-full {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.3s;
      border-radius: 10px;
    }

    #unity-warning {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      padding: 10px;
      background: rgba(220, 38, 38, 0.9);
      border-radius: 8px;
      font-size: 12px;
      display: none;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 1024px) {
      .sidebar {
        width: 70px;
      }

      .sidebar-text {
        display: none;
      }

      .sidebar-icon {
        margin: 0 auto;
      }
    }

    @media (max-width: 768px) {
      .header {
        height: 50px;
        padding: 0 10px;
      }

      .logo-section img {
        width: 32px;
        height: 32px;
      }

      .logo-text h1 {
        font-size: 14px;
      }

      .logo-text p {
        display: none;
      }

      .wallet-info {
        padding: 6px 10px;
      }

      .wallet-address {
        font-size: 10px;
      }

      .game-button {
        padding: 6px 12px;
        font-size: 10px;
      }

      .sidebar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: 60px;
        flex-direction: row;
        justify-content: space-around;
        border-right: none;
        border-top: 2px solid rgba(99, 102, 241, 0.3);
        padding: 5px;
        z-index: 999;
      }

      .sidebar-item {
        flex: 1;
        padding: 8px;
        justify-content: center;
      }

      .sidebar-item.exit {
        margin-top: 0;
      }

      .main-container {
        padding-top: 50px;
        padding-bottom: 60px;
      }

      .canvas-container {
        padding: 10px;
      }

      #unity-container {
        border-radius: 8px;
      }
    }

    @media (max-width: 480px) {
      .canvas-container {
        padding: 5px;
      }

      #unity-container {
        max-width: 100%;
        max-height: 100%;
      }
    }

    /* ========== MOBILE MENU TOGGLE ========== */
    .menu-toggle {
      display: none;
      width: 40px;
      height: 40px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 8px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    .menu-toggle:hover {
      background: rgba(99, 102, 241, 0.4);
    }

    @media (max-width: 768px) {
      .menu-toggle {
        display: flex;
      }
    }

    /* ========== FULLSCREEN BUTTON ========== */
    #unity-fullscreen-button {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 40px;
      height: 40px;
      background: rgba(99, 102, 241, 0.3);
      border: 1px solid rgba(99, 102, 241, 0.5);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      z-index: 10;
    }

    #unity-fullscreen-button:hover {
      background: rgba(99, 102, 241, 0.5);
      transform: scale(1.1);
    }

    #unity-fullscreen-button::before {
      content: "⛶";
      font-size: 20px;
      color: white;
    }

    /* ========== LOADING STATE ========== */
    .loading-text {
      position: absolute;
      top: calc(50% + 40px);
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 14px;
      text-align: center;
    }
  </style>

  <!-- Solana & SPL Token Libraries -->
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  <script src="https://unpkg.com/@solana/spl-token@latest/lib/index.iife.min.js"></script>
  <script src="https://unpkg.com/bs58@4.0.1/dist/index.min.js"></script>
</head>

<body>
  <!-- HEADER -->
  <div class="header">
    <div class="logo-section">
      <img src="../assets/icon/kulino-logo-blue.png" alt="Kulino Logo" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🎮%3C/text%3E%3C/svg%3E'" />
      <div class="logo-text">
        <h1>KULINO GAME</h1>
        <p>Play • Earn • Compete</p>
      </div>
    </div>

    <div class="wallet-info">
      <span class="wallet-address" id="walletDisplay">Connect Wallet</span>
      <button class="game-button" onclick="window.history.back()">← Back</button>
    </div>
  </div>

  <!-- MAIN CONTAINER -->
  <div class="main-container">
    <!-- CANVAS CONTAINER -->
    <div class="canvas-container">
      <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        
        <div id="unity-loading-bar">
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
          <div class="loading-text">Loading Game...</div>
        </div>

        <div id="unity-warning"></div>
        
        <div id="unity-fullscreen-button"></div>
      </div>
    </div>
  </div>

  <!-- KULINO BRIDGE SCRIPT -->
  <script>
    // Banner helper for Unity
    function unityShowBanner(msg, type) {
      try {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.textContent = msg;
        div.style.padding = "8px";
        div.style.margin = "6px";
        if (type === "error") div.style.background = "rgba(200,0,0,0.9)";
        else if (type === "warning") div.style.background = "rgba(200,160,0,0.9)";
        else div.style.background = "rgba(0,0,0,0.6)";
        warningBanner.appendChild(div);
        if (type !== "error") {
          setTimeout(function() { 
            warningBanner.removeChild(div); 
            updateBannerVisibility(); 
          }, 5000);
        }
        updateBannerVisibility();
      } catch(e){ 
        console.warn('unityShowBanner error', e); 
      }
    }

    // Kulino Bridge
    (function(){
      const LOGPREF = '[KULINO-BRIDGE]';
      function dlog(...a){ console.log(LOGPREF, ...a); }

      const sendQueue = [];
      let unityReady = false;

      window.__kulino_unity_ready = function(){
        dlog('Unity ready, flushing queue:', sendQueue.length);
        unityReady = true;
        while(sendQueue.length){
          const item = sendQueue.shift();
          _doSendToUnity(item.method, item.payload);
        }
      };

      function _doSendToUnity(methodName, payloadJson){
        try {
          if (window.unityInstance && typeof window.unityInstance.SendMessage === 'function') {
            dlog('SendMessage ->', methodName);
            window.unityInstance.SendMessage('GameManager', methodName, payloadJson);
          } else {
            console.warn(LOGPREF, 'Unity not ready, queueing');
            sendQueue.push({ method: methodName, payload: payloadJson });
          }
        } catch(e){ 
          console.error(LOGPREF, 'SendMessage exception', e); 
        }
      }

      function sendToUnity(obj){
        const js = JSON.stringify(obj);
        if (!unityReady) { 
          sendQueue.push({ method: 'OnClaimResult', payload: js }); 
          dlog('Queued OnClaimResult'); 
        } else {
          _doSendToUnity('OnClaimResult', js);
        }
      }

      window.requestClaimFromUnity = async function(messageJson) {
        dlog('Claim request:', messageJson);
        try {
          const provider = (window.solana && window.solana.isPhantom) ? window.solana :
                           (window.phantom && window.phantom.solana && window.phantom.solana.isPhantom) ? window.phantom.solana : null;
          
          if (!provider) {
            dlog('Phantom not found');
            sendToUnity({ success:false, error:'phantom_not_installed' });
            return;
          }

          let payloadObj = (typeof messageJson === 'string') ? JSON.parse(messageJson) : messageJson;

          if (!provider.isConnected) {
            dlog('Connecting to Phantom...');
            await provider.connect();
            dlog('Connected:', provider.publicKey?.toString());
          }

          payloadObj.address = provider.publicKey.toString();
          const canonical = {
            address: payloadObj.address,
            gameId: payloadObj.gameId,
            amount: payloadObj.amount,
            nonce: payloadObj.nonce,
            ts: payloadObj.ts
          };
          const messageStr = JSON.stringify(canonical);
          dlog('Signing message:', messageStr);

          const encoded = new TextEncoder().encode(messageStr);
          const signed = await provider.signMessage(encoded, 'utf8');
          dlog('Signature received');

          const sig = bs58.encode(signed.signature);

          dlog('Posting to server...');
          const resp = await fetch('http://localhost:3000/api/claim', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ 
              message: messageStr, 
              signature: sig, 
              publicKey: provider.publicKey.toString() 
            })
          });

          let data;
          try { 
            data = await resp.json(); 
          } catch(e){
            const text = await resp.text().catch(()=>'<no-text>');
            dlog('Server error:', text);
            sendToUnity({ success:false, error:'invalid_server_response', raw: text });
            return;
          }
          
          dlog('Server response:', data);
          sendToUnity(data);

        } catch(err) {
          console.error(LOGPREF, 'Error:', err);
          sendToUnity({ success:false, error: err.message || String(err) });
        }
      };

      window.testClaimFromConsole = async function(){
        const payload = { 
          gameId:'fly-to-moon', 
          amount:1, 
          nonce: crypto.randomUUID(), 
          ts: Date.now() 
        };
        await window.requestClaimFromUnity(JSON.stringify(payload));
      };

      window.__kulino_bridge_info = function(){ 
        return { 
          unityReady, 
          queueLen: sendQueue.length, 
          hasProvider: !!(window.solana && window.solana.isPhantom) 
        }; 
      };

      dlog('Kulino bridge loaded');
    })();

    // RequestClaim wrapper for Unity
    function RequestClaim(message) {
      if (window.requestClaimFromUnity && typeof window.requestClaimFromUnity === 'function') {
        try {
          window.requestClaimFromUnity(message);
        } catch (e) {
          console.error('[RequestClaim]', e);
        }
      } else {
        console.error('[RequestClaim] Function missing');
        if (window.unityInstance && typeof window.unityInstance.SendMessage === 'function') {
          const err = JSON.stringify({ success:false, error:'requestClaimFromUnity_missing' });
          window.unityInstance.SendMessage('GameManager','OnClaimResult', err);
        }
      }
    }
  </script>

  <!-- UNITY LOADER -->
  <script>
    // Get wallet address from URL
    const urlParams = new URLSearchParams(window.location.search);
    const walletAddress = urlParams.get('wallet');
    const gameId = urlParams.get('game');

    if (walletAddress) {
      const shortAddr = walletAddress.slice(0, 6) + '...' + walletAddress.slice(-4);
      document.getElementById('walletDisplay').textContent = shortAddr;
    }

    // Unity configuration
    var canvas = document.querySelector("#unity-canvas");
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebUnity.loader.js";
    
    var config = {
      dataUrl: buildUrl + "/WebUnity.data",
      frameworkUrl: buildUrl + "/WebUnity.framework.js",
      codeUrl: buildUrl + "/WebUnity.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Kulino",
      productName: "FlyToTheMoon",
      productVersion: "1.0",
      showBanner: unityShowBanner,
      matchWebGLToCanvasSize: true,
      devicePixelRatio: window.devicePixelRatio || 1
    };

    // Show loading bar
    document.querySelector("#unity-loading-bar").style.display = "block";

    // Load Unity
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = (100 * progress) + "%";
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";
        window.unityInstance = unityInstance;
        
        // Tell bridge Unity is ready
        if (typeof window.__kulino_unity_ready === 'function') {
          window.__kulino_unity_ready();
        }

        // Fullscreen button
        document.querySelector("#unity-fullscreen-button").onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        console.error('Unity load failed:', message);
        alert('Failed to load game: ' + message);
      });
    };
    
    script.onerror = (e) => {
      console.error('Failed to load Unity loader:', loaderUrl, e);
      unityShowBanner('Failed to load Unity: ' + loaderUrl, 'error');
    };
    
    document.body.appendChild(script);

    // Responsive canvas resize
    window.addEventListener('resize', () => {
      if (window.unityInstance) {
        canvas.style.width = '100%';
        canvas.style.height = '100%';
      }
    });
  </script>
</body>
</html>
